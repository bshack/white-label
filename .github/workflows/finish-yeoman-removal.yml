name: Finish Yeoman removal
on:
  push:
    branches:
      - remove-yeoman-20260913
permissions:
  contents: write
jobs:
  finish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: remove-yeoman-20260913
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Update remaining source references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/generator.test.js')
          s = p.read_text()
          s = s.replace("import {createEnv} from 'yeoman-environment';\n", '')
          old = """    const sourceEnv = createEnv({cwd: path.join(temporary, 'source-site'), skipInstall: true});
              sourceEnv.register(path.join(root, 'generators/app/index.js'), {namespace: 'white-label:app'});
              await sourceEnv.run('white-label:app', {skipInstall: true, force: true});
              const destination = path.join(temporary, 'site');
              const env = createEnv({cwd: destination, skipInstall: true});
              env.register(path.join(temporary, 'package/generators/app/index.js'), {namespace: 'white-label:app'});
              await env.run('white-label:app', {skipInstall: true, force: true});
          """.replace('              ', '')
          new = """    const destination = path.join(temporary, 'site');
              const packagedScaffold = await import(new URL(`file://${path.join(temporary, 'package/dist/scaffold/index.js')}`).href);
              await packagedScaffold.createProject({destination});
          """.replace('              ', '')
          if old not in s:
              raise SystemExit('Yeoman test block not found')
          s = s.replace(old, new)
          s = s.replace("test('programmatic scaffold API creates the same reviewable site without Yeoman'", "test('programmatic scaffold API creates the reviewable site'")
          s = s.replace("test('packaged generator creates a strictly typed Tailwind and JSX site that builds in development and production'", "test('packaged project creator creates a strictly typed Tailwind and JSX site that builds in development and production'")
          p.write_text(s)

          p = Path('AGENTS.md')
          s = p.read_text()
          s = s.replace('`generators/` contains the generator; `app/` contains site templates, browser TypeScript, styles, and data; `scripts/build.ts` builds the site; `test/` holds tests; `dist/` contains compiled code. The package entry is `dist/generators/app/index.js`.', '`scaffold/` contains the project-creation engine; `cli/` contains the command-line adapter; `app/` contains site templates, browser TypeScript, styles, and data; `scripts/build.ts` builds the site; `test/` holds tests; `dist/` contains compiled code. The package entry is `dist/scaffold/index.js`.')
          p.write_text(s)
          PY
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run compile
      - run: git diff --exit-code -- dist
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run audit
      - run: npm pack --dry-run
      - name: Commit verified cleanup
        run: |
          rm .github/workflows/finish-yeoman-removal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md test/generator.test.js .github/workflows/finish-yeoman-removal.yml
          git commit -m "refactor: finish Yeoman removal"
          git push origin HEAD:remove-yeoman-20260913
