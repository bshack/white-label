name: Remove Yeoman
on:
  push:
    branches:
      - remove-yeoman-20260913
permissions:
  contents: write
jobs:
  lockfile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: remove-yeoman-20260913
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          rm .github/workflows/remove-yeoman.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/remove-yeoman.yml
          git commit -m "chore: refresh lockfile without Yeoman"
          git push origin HEAD:remove-yeoman-20260913
