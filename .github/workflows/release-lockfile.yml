name: Finalize Generator 10 release metadata

on:
  pull_request:
    branches: [final-documentation-accuracy-sweep]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Regenerate release dependency metadata
        run: npm install --package-lock-only --ignore-scripts --save-dev white-label-view@7.0.0 white-label-router@6.1.0
      - name: Align release documentation and generated-project contract
        run: |
          node --input-type=module <<'NODE'
          import {readFile, writeFile} from 'node:fs/promises';

          async function replace(path, before, after) {
              const source = await readFile(path, 'utf8');
              if (!source.includes(before)) throw new Error(`Expected release text not found in ${path}`);
              await writeFile(path, source.replace(before, after));
          }

          await replace(
              'README.md',
              "## Coordinated View 7 release\n\nGenerator 10 targets `white-label-view@7`, which provides the tagged-template entrypoint. View 7's implementation is merged but has not yet been published to npm. Until publication, coordinated CI builds and injects the exact merged View 7 revision for integration testing without replacing the generator's registry lockfile with a Git dependency. Publishing View 7 remains a release prerequisite for a normal registry install of Generator 10.",
              "## Coordinated runtime release\n\nGenerator 10 targets the published White Label runtime line: `white-label-mediator@5.0.0`, `white-label-model@7.0.1`, `white-label-router@6.1.0`, and `white-label-view@7.0.0`. Release and CI verification use those registry packages directly."
          );
          await replace(
              'scaffold/AGENTS.md',
              "Generator 10 targets `white-label-mediator@5`, `white-label-model@7`, `white-label-router@6`, and `white-label-view@7`.\n\nView 7's implementation is merged but not yet published. Until publication, CI may build and inject the exact merged View 7 revision solely to verify coordinated code. Do not replace the release lockfile's registry dependency with a Git reference or treat that temporary packed artifact as a published dependency. Registry installation of the final coordinated versions remains a release gate.",
              "Generator 10 targets the published coordinated runtime versions: `white-label-mediator@5.0.0`, `white-label-model@7.0.1`, `white-label-router@6.1.0`, and `white-label-view@7.0.0`. Keep the release lockfile registry-based and regenerate it with the package manager when coordinated runtime versions change."
          );
          await replace(
              'test/generator.test.js',
              "assert.equal(manifest.dependencies['white-label-router'], '6.0.0');",
              "assert.equal(manifest.dependencies['white-label-router'], '6.1.0');"
          );
          const scaffold = await readFile('scaffold/index.ts', 'utf8');
          if (scaffold.includes("'white-label-router': '6.0.0'")) {
              await writeFile('scaffold/index.ts', scaffold.replace("'white-label-router': '6.0.0'", "'white-label-router': '6.1.0'"));
          } else if (!scaffold.includes("'white-label-router': '6.1.0'")) {
              throw new Error('Unexpected Router version in scaffold/index.ts');
          }
          NODE
      - name: Commit generated release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json README.md scaffold/AGENTS.md scaffold/index.ts test/generator.test.js
          if git diff --cached --quiet; then
            echo "Release metadata already current."
            exit 0
          fi
          git commit -m "Finalize Generator 10 release dependencies"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
