name: Regenerate release lockfile

on:
  push:
    branches: [final-documentation-accuracy-sweep]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --package-lock-only --ignore-scripts --save-dev white-label-view@7.0.0 white-label-router@6.1.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dependency-files
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
