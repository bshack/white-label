name: Security checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test-build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run compile
      - name: Capture generated dist
        uses: actions/upload-artifact@v4
        with:
          name: generated-dist
          path: dist
      - run: git diff --exit-code -- dist || true
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run build -- --version=ci --production=true --site-url=https://example.com
      - run: npm run audit
      - run: npm pack --dry-run
      - name: Verify packed install and CLI
        run: |
          PACKAGE="$(npm pack --silent)"
          TEMP="$(mktemp -d)"
          cd "$TEMP"
          npm init -y >/dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE/$PACKAGE" >/dev/null
          node --input-type=module -e "const scaffold=await import('generator-white-label/scaffold'); if (typeof scaffold.createSite !== 'function') process.exit(1)"
          test -e ./node_modules/.bin/white-label
          node ./node_modules/generator-white-label/dist/cli/index.js --help | grep -q "white-label create <directory>"
          rm "$GITHUB_WORKSPACE/$PACKAGE"
