name: Security checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test-build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run compile
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run build -- --version=ci --production=true --site-url=https://example.com
      - run: npm run audit
      - run: npm pack --dry-run
      - name: Create packed package
        run: npm pack --silent
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packed-package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 7
      - name: Verify packed install and CLI
        run: |
          PACKAGE="$(ls *.tgz)"
          TEMP="$(mktemp -d)"
          cd "$TEMP"
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --ignore-scripts "$GITHUB_WORKSPACE/$PACKAGE" >/dev/null
          node --input-type=module -e "const scaffold=await import('generator-white-label'); if (typeof scaffold.createProject !== 'function') process.exit(1)"
          test -e ./node_modules/.bin/white-label
          node ./node_modules/generator-white-label/dist/cli/index.js --help | grep -q "white-label create <directory>"

  minimum-node-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  package-manager-compatibility:
    needs: test-build-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, yarn, pnpm]
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packed-package
          path: package
      - name: Configure package manager
        if: matrix.package-manager != 'npm'
        run: |
          corepack enable
          if [ "${{ matrix.package-manager }}" = "yarn" ]; then
            corepack prepare yarn@4.18.0 --activate
          else
            corepack prepare pnpm@10.17.1 --activate
          fi
      - name: Verify packed package and CLI
        run: |
          PACKAGE="$(realpath package/*.tgz)"
          TEMP="$(mktemp -d)"
          cd "$TEMP"
          printf '{"private":true,"type":"module"}\n' > package.json
          case "${{ matrix.package-manager }}" in
            npm)
              npm install --ignore-scripts "$PACKAGE" >/dev/null
              node --input-type=module -e "const scaffold=await import('generator-white-label'); if (typeof scaffold.createProject !== 'function') process.exit(1)"
              test -e ./node_modules/.bin/white-label
              node ./node_modules/generator-white-label/dist/cli/index.js --help | grep -q "white-label create <directory>"
              ;;
            yarn)
              yarn add "$PACKAGE" >/dev/null
              yarn node --input-type=module -e "const scaffold=await import('generator-white-label'); if (typeof scaffold.createProject !== 'function') process.exit(1)"
              yarn exec white-label --help | grep -q "white-label create <directory>"
              ;;
            pnpm)
              pnpm add --ignore-scripts "$PACKAGE" >/dev/null
              pnpm exec node --input-type=module -e "const scaffold=await import('generator-white-label'); if (typeof scaffold.createProject !== 'function') process.exit(1)"
              pnpm exec white-label --help | grep -q "white-label create <directory>"
              ;;
          esac

  generated-project-compatibility:
    needs: test-build-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, yarn, pnpm]
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packed-package
          path: package
      - name: Configure package manager
        if: matrix.package-manager != 'npm'
        run: |
          corepack enable
          if [ "${{ matrix.package-manager }}" = "yarn" ]; then
            corepack prepare yarn@4.18.0 --activate
          else
            corepack prepare pnpm@10.17.1 --activate
          fi
      - name: Generate, install, and test project
        run: |
          PACKAGE="$(realpath package/*.tgz)"
          TEMP="$(mktemp -d)"
          mkdir "$TEMP/runner"
          cd "$TEMP/runner"
          printf '{"private":true,"type":"module"}\n' > package.json
          case "${{ matrix.package-manager }}" in
            npm)
              npm install --ignore-scripts "$PACKAGE" >/dev/null
              node ./node_modules/generator-white-label/dist/cli/index.js create ../site --jsx
              cd ../site
              npm install >/dev/null
              npm test
              ;;
            yarn)
              YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn add "$PACKAGE" >/dev/null
              yarn exec white-label create ../site --jsx
              cd ../site
              YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install
              yarn test
              ;;
            pnpm)
              pnpm add --ignore-scripts "$PACKAGE" >/dev/null
              pnpm exec white-label create ../site --jsx
              cd ../site
              pnpm install >/dev/null
              pnpm test
              ;;
          esac
