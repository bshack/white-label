name: Security checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# Cancel a pull request run once a newer push to that pull request starts. Push, schedule and manual runs
# each get their own group, so they are never cancelled or queued behind one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test-build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # coverage compiles (a full typecheck), runs the consumer type checks, and runs every unit test.
      - run: npm run coverage
      - run: npm run build -- --version=ci --production=true --site-url=https://example.com
      - run: npm run audit
      - run: npm pack --dry-run
      - name: Create packed package
        run: npm pack --silent
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packed-package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 7
      - name: Verify packed install and CLI
        run: |
          PACKAGE="$(ls *.tgz)"
          TEMP="$(mktemp -d)"
          cd "$TEMP"
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --ignore-scripts "$GITHUB_WORKSPACE/$PACKAGE" >/dev/null
          node --input-type=module -e "const scaffold=await import('generator-white-label'); if (typeof scaffold.createProject !== 'function') process.exit(1)"
          for CLI in generator-white-label white-label; do
            test -e "./node_modules/.bin/$CLI"
            "./node_modules/.bin/$CLI" --help | grep -q "white-label create <directory>"
          done
          npx --yes generator-white-label --help | grep -q "white-label create <directory>"

  minimum-node-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  package-manager-compatibility:
    needs: test-build-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, yarn, pnpm]
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packed-package
          path: package
      - name: Configure package manager
        if: matrix.package-manager != 'npm'
        run: |
          corepack enable
          if [ "${{ matrix.package-manager }}" = "yarn" ]; then
            corepack prepare yarn@4.18.0 --activate
          else
            corepack prepare pnpm@10.17.1 --activate
          fi
      - name: Verify packed package and CLI
        run: |
          PACKAGE="$(realpath package/*.tgz)"
          TEMP="$(mktemp -d)"
          cd "$TEMP"
          printf '{"private":true,"type":"module"}\n' > package.json
          case "${{ matrix.package-manager }}" in
            npm)
              npm install --ignore-scripts "$PACKAGE" >/dev/null
              node --input-type=module -e "const scaffold=await import('generator-white-label'); if (typeof scaffold.createProject !== 'function') process.exit(1)"
              ./node_modules/.bin/generator-white-label --help | grep -q "white-label create <directory>"
              ./node_modules/.bin/white-label --help | grep -q "white-label create <directory>"
              npx --yes generator-white-label --help | grep -q "white-label create <directory>"
              ;;
            yarn)
              yarn add "$PACKAGE" >/dev/null
              yarn node --input-type=module -e "const scaffold=await import('generator-white-label'); if (typeof scaffold.createProject !== 'function') process.exit(1)"
              yarn exec generator-white-label --help | grep -q "white-label create <directory>"
              yarn exec white-label --help | grep -q "white-label create <directory>"
              ;;
            pnpm)
              pnpm add --ignore-scripts "$PACKAGE" >/dev/null
              pnpm exec node --input-type=module -e "const scaffold=await import('generator-white-label'); if (typeof scaffold.createProject !== 'function') process.exit(1)"
              pnpm exec generator-white-label --help | grep -q "white-label create <directory>"
              pnpm exec white-label --help | grep -q "white-label create <directory>"
              ;;
          esac

  generated-project-compatibility:
    needs: test-build-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, yarn, pnpm]
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packed-package
          path: package
      - name: Configure package manager
        if: matrix.package-manager != 'npm'
        run: |
          corepack enable
          if [ "${{ matrix.package-manager }}" = "yarn" ]; then
            corepack prepare yarn@4.18.0 --activate
          else
            corepack prepare pnpm@10.17.1 --activate
          fi
      - name: Generate, install, and test project
        run: |
          PACKAGE="$(realpath package/*.tgz)"
          TEMP="$(mktemp -d)"
          mkdir "$TEMP/runner"
          cd "$TEMP/runner"
          printf '{"private":true,"type":"module"}\n' > package.json
          case "${{ matrix.package-manager }}" in
            npm)
              npm install --ignore-scripts "$PACKAGE" >/dev/null
              npx --yes generator-white-label create ../site
              cd ../site
              npm install >/dev/null
              npm test
              ;;
            yarn)
              YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn add "$PACKAGE" >/dev/null
              yarn exec white-label create ../site
              cd ../site
              YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install
              yarn test
              ;;
            pnpm)
              pnpm add --ignore-scripts "$PACKAGE" >/dev/null
              pnpm exec white-label create ../site
              cd ../site
              pnpm install >/dev/null
              pnpm test
              ;;
          esac
