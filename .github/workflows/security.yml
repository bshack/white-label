name: Security checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test-build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run compile
      - uses: actions/upload-artifact@v7
        with:
          name: generated-migration-files
          path: |
            package-lock.json
            dist
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run build -- --version=ci --production=true --site-url=https://example.com
      - run: npm run audit
      - run: npm pack --dry-run
